; /etc/supervisor/conf.d/work-horizon.conf
; Keeps Horizon (queue workers: crawl, llm, discovery) running and restarts it after deploys.
[program:work-horizon]
process_name=%(program_name)s
command=/usr/bin/php8.3 /var/www/work/artisan horizon
directory=/var/www/work
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; long enough for a running discovery job (polite delays) to finish on restart
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/work/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
