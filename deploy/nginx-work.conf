# /etc/nginx/sites-available/work   (symlinked into sites-enabled)
# Replace SERVER_NAME below — see DEPLOYMENT.md step 7 (subdomain, or IP + port 8080).

server {
    listen 80;                       # IP-only setup: change to `listen 8080;`
    server_name SERVER_NAME;         # e.g. work.example.com   (IP-only: the server IP)

    root /var/www/work/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/work.access.log;
    error_log  /var/log/nginx/work.error.log;
}
